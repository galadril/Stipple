name: Release

# Tagging cuts a release of what actually exists, which is now three things:
# the device library, the tools to build a flashable image from your own
# capture, and the browser emulator.
#
# What is deliberately *not* here is update.img. A res image contains Ulanzi's
# libzkgui.so - seven and a half megabytes of their firmware - so publishing
# one would be redistributing it. The image-builder artifact is the honest
# substitute: it carries our half and builds the rest against a capture of the
# device it is going to be installed on, which never leaves that machine.

# Publishing needs a tag. A manual run builds, checks and packages
# everything, and deliberately publishes nothing.
#
# That is not a safety setting somebody can switch off - it is what the job
# can actually do. `gh release create` names the release after the ref it ran
# on, which for a tag push is `v0.2.0` and for a manual run is the *branch*.
# A manual publish would produce a release tagged `feature/whatever`.
#
# There used to be a `dry_run` input here, defaulting to true. Nothing ever
# read it: the publish job is gated on the event, not on the input, so the
# checkbox did nothing whichever way it was set. An option that appears to
# control something and does not is worse than no option.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Distinct from ci.yml's group on purpose: a release must not cancel the CI run
# it depends on, and a half-published release is worse than a slow one.
concurrency:
  group: stipple-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The version lives in three places that can drift silently: the git tag,
  # project(VERSION) in CMakeLists.txt, and kVersion in Version.h, which is what
  # the device reports over /api/v1/version and paints on the splash. A release
  # whose binary reports a different version than its tag is unsupportable, so
  # disagreement fails here rather than being discovered in a bug report.
  guard:
    name: Version agreement
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            # A dispatch run has no tag; take the source of truth as given and
            # verify the other two against it.
            version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)"
            tag="v${version}"
          fi

          cmake_version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)"
          header_version="$(sed -nE 's/.*kVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' firmware/include/stipple/core/Version.h | head -1)"

          echo "tag              ${tag}"
          echo "CMakeLists.txt   ${cmake_version}"
          echo "Version.h        ${header_version}"

          if [ -z "$cmake_version" ] || [ -z "$header_version" ]; then
            echo "::error::could not parse a version out of CMakeLists.txt or Version.h"
            exit 1
          fi

          fail=0
          [ "$version" = "$cmake_version" ] || { echo "::error::tag ${tag} disagrees with CMakeLists.txt ${cmake_version}"; fail=1; }
          [ "$version" = "$header_version" ] || { echo "::error::tag ${tag} disagrees with Version.h ${header_version}"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # The full gate set, not a copy of it. If CI is weakened or strengthened, the
  # release path moves with it.
  verify:
    name: Verify
    needs: guard
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs: [guard, verify]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Same pin as ci.yml, per blueprint §32. A release built on a
          # different toolchain than CI tested is not the artifact CI verified.
          version: 3.1.64

      # kBuildCommit ships as the literal "unknown" so an unstamped build is
      # obvious rather than plausible. Release builds are the one place it gets
      # a real value.
      - name: Stamp build commit
        run: |
          set -euo pipefail
          header=firmware/include/stipple/core/Version.h
          sed -i -E "s/(kBuildCommit[[:space:]]*=[[:space:]]*\")unknown(\")/\1${GITHUB_SHA}\2/" "$header"
          grep -q "${GITHUB_SHA}" "$header" || { echo "::error::failed to stamp kBuildCommit"; exit 1; }

      - name: Build emulator
        run: |
          emcmake cmake -S . -B build/emulator \
            -DSTIPPLE_BUILD_EMULATOR=ON -DSTIPPLE_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/emulator

      # The WASM module is loaded through Emscripten glue whose export list is
      # generated at link time; a missing export is invisible to the C++ suite
      # and fatal in the browser. dev.ps1 has this verb locally, so a release
      # should not skip it.
      - name: Verify emulator module
        run: node simulator/web/tools/verify.mjs

      # Taken from the CI run above rather than rebuilt here. CI builds it in
      # the pinned container and checks it can actually load on a device -
      # glibc 2.30, no GLIBCXX - and a rebuild on this runner would be a
      # different binary than the one those checks passed on.
      - name: Fetch the device library from CI
        uses: actions/download-artifact@v4
        with:
          name: libstipple-so
          path: dist

      - name: Assemble artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/emulator

          for f in index.html styles.css app.js stipple-core.js stipple-core.wasm; do
            cp "simulator/web/public/$f" dist/emulator/
          done

          zip -j -q "dist/stipple-emulator-${VERSION}.zip" dist/emulator/*

          # Renamed so a downloaded file says what it is and which version it
          # is. The device does not care about the name: installing it is an
          # upload through Settings > Firmware, which writes it where the shim
          # looks.
          mv dist/libstipple.so "dist/libstipple-${VERSION}.so"

          # The image builder: everything needed to produce a flashable
          # update.img except the one thing that cannot be published.
          #
          # A res image contains Ulanzi's libzkgui.so. Shipping one would be
          # redistributing their firmware, so this ships our half - the shim
          # source, the library, and the script that rebuilds a capture with
          # them - and the vendor's half is taken from the user's own device,
          # where it already legitimately is.
          mkdir -p dist/imagebuilder
          cp tooling/imgtool/buildres.sh tooling/imgtool/imgtool.py dist/imagebuilder/
          cp firmware/tools/startup_shim/main.cpp dist/imagebuilder/startup_shim.cpp
          cp "dist/libstipple-${VERSION}.so" dist/imagebuilder/libstipple.so
          cp docs/install.md dist/imagebuilder/README.md
          zip -j -q "dist/stipple-imagebuilder-${VERSION}.zip" dist/imagebuilder/*

          # Everything the manifest is about to describe must already exist.
          #
          # It did not, once: the manifest was written before the image
          # builder was zipped, so sha256sum and stat both failed, their empty
          # output left `"bytes": ,` in the file, and the whole thing surfaced
          # as a JSON decode error pointing at line 19 - which says nothing
          # about what actually went wrong.
          for f in "dist/libstipple-${VERSION}.so" \
                   "dist/stipple-imagebuilder-${VERSION}.zip" \
                   "dist/stipple-emulator-${VERSION}.zip"; do
            [ -f "$f" ] || { echo "::error::manifest would describe a missing file: $f"; exit 1; }
          done

          api_version="$(sed -nE 's/.*kApiVersion[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' firmware/include/stipple/core/Version.h | head -1)"

          # Blueprint §28's manifest shape, with the honesty fields this stage
          # needs: nothing here installs onto hardware, and a manifest that
          # omitted that would read as though it did.
          cat > dist/manifest.json <<EOF
          {
            "channel": "dev",
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apiVersion": ${api_version},
            "hardware": [],
            "installable": true,
            "note": "Updates an existing STIPPLE device through Settings > Firmware. It does not install STIPPLE onto a stock device - that needs a res image built from your own device's capture, which cannot be published because it contains vendor firmware. See docs/install.md.",
            "artifacts": [
              {
                "name": "stipple-emulator-${VERSION}.zip",
                "sha256": "$(sha256sum "dist/stipple-emulator-${VERSION}.zip" | cut -d' ' -f1)",
                "bytes": $(stat -c%s "dist/stipple-emulator-${VERSION}.zip")
              },
              {
                "name": "stipple-imagebuilder-${VERSION}.zip",
                "sha256": "$(sha256sum "dist/stipple-imagebuilder-${VERSION}.zip" | cut -d' ' -f1)",
                "bytes": $(stat -c%s "dist/stipple-imagebuilder-${VERSION}.zip"),
                "target": "tc002"
              },
              {
                "name": "libstipple-${VERSION}.so",
                "sha256": "$(sha256sum "dist/libstipple-${VERSION}.so" | cut -d' ' -f1)",
                "bytes": $(stat -c%s "dist/libstipple-${VERSION}.so"),
                "target": "tc002"
              }
            ]
          }
          EOF

          python3 -c "import json,sys; json.load(open('dist/manifest.json'))" \
            || { echo "::error::generated manifest.json is not valid JSON"; exit 1; }

          ( cd dist && sha256sum "stipple-emulator-${VERSION}.zip" "stipple-imagebuilder-${VERSION}.zip" "libstipple-${VERSION}.so" manifest.json > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stipple-release-${{ env.VERSION }}
          path: dist/

      # Said out loud, because "Publish release — Skipped" in the job list
      # looks like something went wrong rather than like the answer.
      - name: Note what happens next
        if: github.event_name != 'push'
        run: |
          echo "::notice::Built and packaged ${VERSION}. Nothing will be published:"
          echo "::notice::a release is cut by pushing a tag, not by running this by hand."
          echo "::notice::  git tag v${VERSION} && git push origin v${VERSION}"

      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/emulator

  publish:
    name: Publish release
    needs: [guard, package]
    # Tag pushes only. See the note on the triggers above: a manual run has no
    # tag to release as, so this is skipped rather than made optional.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stipple-release-${{ needs.guard.outputs.version }}
          path: dist

      # The section for this version, lifted out of CHANGELOG.md.
      #
      # Written by hand and read from the file rather than generated from
      # commit subjects: a changelog is for somebody deciding whether to
      # install this, and a list of commits answers a different question.
      #
      # A missing section stops the release. Notes that quietly fall back to
      # boilerplate are how a release goes out describing the previous one.
      - name: Extract the changelog
        run: |
          set -euo pipefail
          awk -v ver="## ${VERSION}" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md

          if [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          echo "--- what the release will say ---"
          cat changes.md

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Stipple ${VERSION}

          $(cat changes.md)

          ---

          ## Downloads

          > **Use at your own risk.** STIPPLE replaces firmware on hardware it
          > was not designed for. It can leave your device unusable and will
          > probably void your warranty. It comes with **no warranty and no
          > liability** (GPL-3.0 sections 15-16). Do not install it on a
          > device you are not prepared to lose.

          ### \`libstipple-${VERSION}.so\` — for a device already running STIPPLE

          Install it through **Settings → Firmware** in the device's web UI.
          It is written beside the running version and renamed into place, so
          a failed upload changes nothing, and the previous version is kept so
          you can go back. Nothing is flashed.

          Built in the pinned toolchain and checked, in CI, that it can
          actually load on the hardware: 32-bit ARM, no \`GLIBCXX\` symbols,
          and nothing newer than \`GLIBC_2.30\`. A library that fails those is
          not published, because it would flash and verify perfectly and then
          fail at \`dlopen\` where only ADB can see it.

          **This does not install STIPPLE onto a stock device.** That needs a
          \`res\` image built from a capture of your own device, which cannot
          be published — it contains Ulanzi's firmware. See
          [docs/install.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md).

          ### \`stipple-imagebuilder-${VERSION}.zip\` — for a stock device

          Everything needed to build a flashable \`update.img\` **except the
          one part that cannot be published**: a \`res\` image contains
          Ulanzi's own \`libzkgui.so\`, so shipping one would be
          redistributing their firmware.

          So this carries our half — the boot shim, the library, and the
          script that rebuilds an image with them — and takes the vendor's
          half from a capture of your own device, where it already
          legitimately is.

          **Capture first.** It is the only copy of your device's original
          firmware that will ever exist.

          ### \`stipple-emulator-${VERSION}.zip\` — no hardware needed

          The same framebuffer, font engine, scene renderer, app scheduler and
          API router the device runs - including the same Berry interpreter, so
          a script tried in a browser behaves the way it will on the panel.
          Only the platform adapter differs.

          ### Try it

          No hardware and no time limit. Unpack
          \`stipple-emulator-${VERSION}.zip\` and serve the directory over HTTP:

          \`\`\`
          python -m http.server 8080
          \`\`\`

          Then open <http://localhost:8080/>. \`file://\` will not work — the
          WASM module needs a real MIME type and a same-origin fetch.

          ### Verify

          \`\`\`
          sha256sum -c SHA256SUMS
          \`\`\`

          \`manifest.json\` carries the version, commit, API version and
          artifact digests.
          EOF

      - name: Create release
        run: |
          set -euo pipefail

          # Every file the notes describe has to actually be attached.
          #
          # This list previously omitted libstipple-*.so while the notes spent
          # four paragraphs on it, so every release promised a download it did
          # not carry. Checked rather than trusted, because the failure is
          # silent: the release publishes, looks complete, and only the person
          # trying to install it finds out.
          assets=(
            "dist/libstipple-${VERSION}.so"
            "dist/stipple-imagebuilder-${VERSION}.zip"
            "dist/stipple-emulator-${VERSION}.zip"
            "dist/manifest.json"
            "dist/SHA256SUMS"
          )
          for a in "${assets[@]}"; do
            [ -f "$a" ] || { echo "::error::missing release asset: $a"; exit 1; }
          done

          # 0.x is development, so never "latest stable". Prerelease stays
          # until the interfaces stop moving.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Stipple ${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            "${assets[@]}"

  # Opt-in, and deliberately so: this is the step that makes the emulator
  # public. Enable Pages for the repository (Settings -> Pages -> Source:
  # GitHub Actions), then set the repository variable STIPPLE_PAGES to "true".
  # Until both are done the job is skipped rather than failed, so a release
  # does not go red over a publishing channel nobody asked for yet.
  # Pages moved to its own workflow (.github/workflows/pages.yml). The job
  # that used to live here called deploy-pages without ever uploading an
  # artifact, so it could only ever have failed, and the site is now more than
  # the emulator anyway.
