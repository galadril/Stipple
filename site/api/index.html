  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--void);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);

    max-width: 76rem; margin: 0 auto;

  }

  .intro code { color: var(--cyan); }
  /* Redoc brings its own layout; give it a light surface so its typography
     stays readable rather than fighting a dark page it was not built for. */

  noscript { display: block; padding: 2rem clamp(1.25rem, 5vw, 3rem); color: var(--dim); }
